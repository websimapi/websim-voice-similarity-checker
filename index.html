<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Similarity Checker</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "meyda": "https://cdn.jsdelivr.net/npm/meyda@5.6.0/dist/web/meyda.module.js"
      }
    }
    </script>
</head>
<body>
    <main>
        <h1>Voice Similarity Checker</h1>
        <p>Upload two audio files of spoken voice to see how similar they sound.</p>

        <div class="card">
            <div class="file-upload-container">
                <div class="file-input-wrapper">
                    <label for="audioFile1">Audio File 1</label>
                    <input type="file" id="audioFile1" accept="audio/*">
                    <span id="fileName1" class="file-name">No file selected</span>
                </div>
                <div class="file-input-wrapper">
                    <label for="audioFile2">Audio File 2</label>
                    <input type="file" id="audioFile2" accept="audio/*">
                    <span id="fileName2" class="file-name">No file selected</span>
                </div>
            </div>
            <button id="compareBtn">Compare Voices</button>
        </div>

        <div id="result" class="result-container hidden">
            <h2>Result</h2>
            <div class="loader-wrapper">
                <div class="loader"></div>
                <p id="statusText">Processing...</p>
            </div>
            <div id="scoreContainer" class="hidden">
                <p>The voices are</p>
                <div id="similarityScore" class="score">0%</div>
                <p>similar!</p>
            </div>
        </div>

    </main>
    <script type="module" src="main.js"></script>

</body>
</html>
